services:
  - type: web
    name: shop-karo
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REACT_APP_BACKEND_SERVER
        value: ""
      - key: DB_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_SENDER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: SITE_NAME
        sync: false
      - key: JWT_SECRET_KEY_ADMIN
        sync: false
      - key: JWT_SECRET_KEY_BUYER
        sync: false
      - key: RPKEYID
        sync: false
      - key: RPSECRETKEY
        sync: false
